[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-ai-monitor"
version = "0.1.0"
description = "Edge AI monitoring backend with object detection and FastAPI dashboard API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi",
  "pydantic",
  "numpy",
  "uvicorn",
]

[tool.setuptools]
packages = ["backend"]

