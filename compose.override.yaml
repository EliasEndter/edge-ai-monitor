services:
  backend:
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./logs:/app/logs
    command: uvicorn backend.api:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    command: npm run dev
    environment:
      - NODE_ENV=development
      - API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
